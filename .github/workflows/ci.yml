name: Verify

on:
  push:
    branches: [main, solid-package]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prepare automation sidecar
        shell: pwsh
        run: |
          npm run build:sidecar
          npm run prepare:sidecar

      - name: Verify TypeScript and tests
        run: |
          npm run typecheck
          npm test

      - name: Verify Rust host and tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS setup wizard
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json

      - name: Enforce installer size below 50 MiB
        run: npm run verify:installer

      - name: Smoke test installed application startup
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -File
          if ($installer.Count -ne 1) { throw "Expected one installer, found $($installer.Count)" }
          Start-Process $installer.FullName -ArgumentList "/S" -Wait

          $app = Get-ChildItem $env:LOCALAPPDATA -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -in @("Kuntyy AutoPrompt.exe", "kuntyy-autoprompt.exe") } |
            Select-Object -First 1
          if (-not $app) { throw "Installed application executable was not found." }

          $process = Start-Process $app.FullName -PassThru
          $startupLog = Join-Path $app.DirectoryName "logs/startup.log"
          $deadline = (Get-Date).AddSeconds(25)
          $startupOutput = ""
          while ((Get-Date) -lt $deadline) {
            if ($process.HasExited) {
              Get-ChildItem (Join-Path $app.DirectoryName "logs") -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName }
              throw "Installed application exited during the startup smoke test (exit code $($process.ExitCode))."
            }
            if (Test-Path $startupLog) {
              $startupOutput = Get-Content $startupLog -Raw -ErrorAction SilentlyContinue
              if ($startupOutput -match "Automation runtime is ready\." -or $startupOutput -match "Automation runtime is unavailable:") {
                break
              }
            }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $startupLog)) { throw "Application startup log was not created." }
          if ($startupLog -notlike "$($app.DirectoryName)*") { throw "Application logs were not written inside the installation directory." }
          $startupOutput = Get-Content $startupLog -Raw
          Write-Host $startupOutput
          if ($startupOutput -match "Automation runtime is unavailable:") {
            throw "Installed application opened, but its automation runtime failed to start. See startup.log above for the reason."
          }
          if ($startupOutput -notmatch "Automation runtime is ready\.") {
            throw "Installed application startup was not confirmed within 25 seconds."
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: kuntyy-autoprompt-windows-test
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
