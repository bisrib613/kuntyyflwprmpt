name: Verify

on:
  push:
    branches: [main, solid-package]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/resources/node.exe -Force
          npm run build:sidecar
          npm run prepare:sidecar

      - name: Verify TypeScript and tests
        run: |
          npm run typecheck
          npm test

      - name: Verify Rust host
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build NSIS setup wizard
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json

      - name: Enforce installer size below 50 MiB
        run: npm run verify:installer

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: kuntyy-autoprompt-windows-test
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
