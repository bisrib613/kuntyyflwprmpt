name: Verify

on:
  push:
    branches: [main, solid-package]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled Node runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/resources/node.exe -Force

      - name: Verify TypeScript and tests
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Verify Rust host
        run: cargo check --manifest-path src-tauri/Cargo.toml
